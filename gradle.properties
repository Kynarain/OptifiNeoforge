# The 1.20.x project, on its own branch. This line covers Minecraft 1.20.1, 1.20.2, 1.20.4 and
# 1.20.6; the default target below is the one this line starts with. Build with: .\gradlew build
#
# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G

# Minecraft and NeoForge for this line. Each of these Minecraft versions has its own NeoForge:
# 1.20.1 -> 47.x, 1.20.2 -> 20.2.x, 1.20.4 -> 20.4.x, 1.20.6 -> 20.6.x. Switch with -Pmc together
# with -Pneoforge, which build.gradle insists on, so an unverified pairing cannot look supported.
minecraft_version=1.20.1
neoforge_version=1.20.1-47.1.106

# Mod Properties
# The jar's version is "<mod_version_base>+mc<minecraft version>", i.e. SemVer plus the Minecraft
# version as build metadata. It stays 0.x until the loader actually runs in the game; see
# docs/VERSIONING.md, and change it only through release/version.ps1.
mod_version_base=0.1.0
maven_group=kynarain.cn
archives_base_name=OptifiNeoforge

# Java 17 for 1.20.1 to 1.20.4, which is what those NeoForge builds require.
target_java_version=17

# Dependencies
# ASM version to compile against; at runtime NeoForge ships its own copy. Pinned per line, because
# the line's NeoForge constrains it: on the 1.21.x line 21.4.149 requires strictly 9.8, and an older
# line may well require something else - the build says so if this is wrong.
asm_version=9.8
