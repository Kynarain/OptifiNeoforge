plugins {
    // NeoForge's own Gradle plugin (see settings.gradle for its repository). It resolves
    // Minecraft and NeoForge, wires the development runs and builds the mod jar.
    id 'net.neoforged.moddev'
}

// The 1.21.x line covers several Minecraft versions, so the target is switchable:
//
//   .\gradlew build                        -> the default target from gradle.properties
//   .\gradlew build -Pmc=1.21.8 -Pneoforge=21.8.52
//
// NeoForge changes with the Minecraft version, and no table of those pairings is baked in here:
// a version that has not been verified on this line would otherwise look supported. When -Pmc
// names something other than the default, -Pneoforge is required, so the pairing is always
// stated by whoever asks for it. docs/MATRIX.md is where verified pairings are recorded.
def defaultMc = project.minecraft_version.toString()
def defaultNeoForge = project.neoforge_version.toString()
def targetMc = (project.findProperty('mc') ?: defaultMc).toString()
def targetNeoForge = project.findProperty('neoforge')?.toString()
if(targetNeoForge == null){
    if(targetMc != defaultMc){
        throw new GradleException(
            "no NeoForge version recorded for Minecraft ${targetMc}: pass -Pneoforge=<version>, " +
            "and record the pairing in docs/MATRIX.md once it is verified")
    }
    targetNeoForge = defaultNeoForge
}

version = "${project.mod_version_base}+mc${targetMc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The Java requirement is per line - 17 for 1.20.1 to 1.20.4, 21 for 1.20.6 - and lives in
// gradle.properties so all three branches state their own requirement in the same place.
def targetJavaVersion = Integer.parseInt(project.target_java_version.toString())

// The ModLauncher generation decides which transformer adapter is compiled. This line serves both
// generations - 1.20.1 to 1.20.4 run ModLauncher 10, 1.20.6 runs 11 - and their transformer
// interfaces differ in a way no single source file can bridge: 10 requires a parameterized
// ITransformer and has no getTargetType(), 11 makes getTargetType() abstract. Both adapters are
// therefore in the tree under the same class name, and exactly one source root is compiled. Same
// rule as -Pneoforge: a target that was not verified has to be stated rather than guessed.
def defaultModLauncher = project.modlauncher_generation.toString()
def targetModLauncher = project.findProperty('modlauncher')?.toString()
if(targetModLauncher == null){
    if(targetMc != defaultMc){
        throw new GradleException(
            "no ModLauncher generation recorded for Minecraft ${targetMc}: pass -Pmodlauncher=10 or 11 " +
            "(1.20.1 to 1.20.4 are 10, 1.20.6 is 11), and record the line in docs/MATRIX.md once verified")
    }
    targetModLauncher = defaultModLauncher
}
if(!(targetModLauncher in ['10', '11'])){
    throw new GradleException("unknown ModLauncher generation '${targetModLauncher}': expected 10 or 11")
}
sourceSets.main.java.srcDir "src/ml${targetModLauncher}/java"

neoForge {
    version = targetNeoForge

    // This mod is client only, so only the client run is set up. `runClient` is for
    // development; a released jar is a normal mod jar in build/libs.
    runs {
        client {
            client()
        }
    }

    mods {
        optifineoforge {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // ModDevGradle puts Minecraft and NeoForge on the compile classpath by itself, and the
    // NeoForge distribution provides Loader, ModLauncher, ASM and Mixin at runtime. Nothing
    // is bundled into the mod jar; these are compile-time only.
    compileOnly "org.ow2.asm:asm:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-tree:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-commons:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-analysis:${project.asm_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

// The offline tools (kynarain.cn.optifineoforge.optifine) compile against the ASM version named in
// gradle.properties, not against the one this line's NeoForge pins: 20.4.251's modDevApiElements
// demands an older org.ow2.asm, whose Remapper has no API-version constructor, and SrgRemap needs it -
// measured here: "cannot apply Remapper's constructor to the given types; required: no arguments,
// found: int". Raising asm_version alone cannot work (the classpath stops resolving), and using the
// no-argument constructor instead changes what the remap produces: measured on the 1.21.x line, the
// payload grew by 501 bytes and that line died with "AbstractMethodError: Receiver class
// net.minecraft.client.particle.ParticleEngine$$Lambda ... ParticleProvider create(SpriteSet)". The
// rig compiles these same tools with the newest ASM in libraries/ - 9.10.1 - so this is the version
// they are verified against, and it is forced only for this project's own compileOnly dependencies.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion project.asm_version
            details.because 'the tools are verified against this ASM version; this line\'s NeoForge pins an older one'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', targetMc
    inputs.property 'neoforge_version', targetNeoForge
    filteringCharset = 'UTF-8'

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version,
                'minecraft_version': targetMc,
                'neoforge_version': targetNeoForge
    }
}

tasks.named('build') {
    doFirst {
        println "Building ${project.archives_base_name} ${project.version} (Minecraft ${targetMc}, " +
                "NeoForge ${targetNeoForge}, Java ${targetJavaVersion})"
    }
}
